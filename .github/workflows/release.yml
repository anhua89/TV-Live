name: Build signed TV APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to Releases and enable in-app updates'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

concurrency:
  group: tv-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
      TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
      TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
      TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          for variable in TV_KEYSTORE_BASE64 TV_STORE_PASSWORD TV_KEY_ALIAS TV_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: $variable"
              exit 1
            fi
          done
          python3 tools/check_project.py
          if [ "$PUBLISH_RELEASE" = 'true' ]; then python3 tools/check_release.py; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk_root" ]; then
            echo '::error::The ubuntu-24.04 runner has no Android SDK at the expected path.'
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          if [ ! -f "$sdk_root/platforms/android-35/android.jar" ] || [ ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]; then
            sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdk_manager" ]; then sdk_manager="$(command -v sdkmanager || true)"; fi
            if [ -z "$sdk_manager" ]; then echo '::error::sdkmanager is unavailable.'; exit 1; fi
            license_input="$(mktemp)"
            for i in {1..100}; do printf 'y\n'; done > "$license_input"
            "$sdk_manager" --sdk_root="$sdk_root" --licenses < "$license_input"
            rm -f "$license_input"
            "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/aapt2"
          test -x "$sdk_root/build-tools/35.0.0/apksigner"
      - name: Restore signing key
        run: |
          signing_path="$RUNNER_TEMP/tv-release.p12"
          umask 077
          printf '%s' "$TV_KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          printf 'TV_KEYSTORE_PATH=%s\n' "$signing_path" >> "$GITHUB_ENV"
          keytool -list -keystore "$signing_path" -storepass:env TV_STORE_PASSWORD -alias "$TV_KEY_ALIAS" > /dev/null
      - name: Test, lint and build signed release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Prepare APK and update manifest
        id: metadata
        run: python3 tools/release.py --apk app/build/outputs/apk/release/app-release.apk --output release-output
      - name: Downloadable build result
        uses: actions/upload-artifact@v4
        with:
          name: AnhuaTV-${{ steps.metadata.outputs.version_name }}
          path: release-output/
          retention-days: 30
      - name: Publish a complete release
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release-output/*.apk release-output/update.json \
            --draft --target "$BUILD_COMMIT" --title "安华电视 $VERSION_NAME" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tv-release.p12"
